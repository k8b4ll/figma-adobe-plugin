<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; font-size: 12px; margin: 0; padding: 14px; background: #2b2b2b; color: #ddd; }
    h4 { margin: 0 0 8px; font-size: 13px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; flex: none; }
    .dot.on { background: #3ec16d; }
    .dot.err { background: #e5484d; }
    #log { color: #999; line-height: 1.4; }
  </style>
</head>
<body>
  <h4>Figma Bridge</h4>
  <div class="row"><span class="dot" id="dot"></span><span id="status">Starting...</span></div>
  <div id="log">Select layers in Figma and click Send.</div>
  <script src="main.js"></script>
</body>
</html>
