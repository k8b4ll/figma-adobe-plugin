<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #000;
      --lime: #c6ff3d;
      --dim: rgba(198, 255, 61, .55);
      --faint: rgba(198, 255, 61, .3);
      --err: #ff7a59;
      --mono: "JetBrains Mono", "Space Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --stag: 190ms;   /* delay between one row and the next */
      --dur: 650ms;    /* how long a line takes to draw */
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { padding: 16px; overflow: hidden; background: var(--bg); color: var(--lime);
      font: 10.5px/1.6 var(--mono); -webkit-font-smoothing: antialiased; user-select: none; }
    button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible { outline: 1px dotted var(--lime); outline-offset: 3px; }
    kbd { font: inherit; opacity: .6; }

    .top { display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: .06em; padding: 4px 4px 8px; }
    .stage { min-height: 252px; display: flex; align-items: center; justify-content: center; }
    .stage.compact { min-height: 150px; }
    .logos { display: flex; gap: 28px; }
    .logo { display: block; }
    .mark { display: block; width: 92px; height: 92px; }

    /* options panel: rows slide in one after another, lines draw left to right,
       and the text is typed in a step behind the line */
    .panel { display: none; margin-top: 4px; }
    .panel.open { display: block; }
    .orow { position: relative; }
    .line { height: 1px; background: var(--lime); opacity: .85; transform-origin: left center; transform: scaleX(0); }
    .tx { clip-path: inset(-6px 100% -6px -6px); }
    .orow.cr::after { content: ""; position: absolute; left: 0; bottom: 7px; width: .62em; height: 1.1em; background: var(--lime); opacity: 0; pointer-events: none; }

    .panel.open .line { animation: drawline var(--dur) linear forwards; animation-delay: calc(var(--i) * var(--stag)); }
    .panel.open .tx { animation: typeWipe calc(var(--dur) - 100ms) steps(46, end) forwards, slideIn 460ms cubic-bezier(.2, .7, .2, 1) forwards;
      animation-delay: calc(var(--i) * var(--stag) + 120ms); }
    .panel.open .orow.cr::after { animation: caretMove calc(var(--dur) - 100ms) steps(46, end) forwards, caretShow calc(var(--dur) - 100ms) linear forwards;
      animation-delay: calc(var(--i) * var(--stag) + 120ms); }
    @keyframes drawline { to { transform: scaleX(1); } }
    @keyframes typeWipe { from { clip-path: inset(-6px 100% -6px -6px); } to { clip-path: inset(-6px -6px -6px -6px); } }
    @keyframes slideIn { from { transform: translateX(-18px); } to { transform: translateX(0); } }
    @keyframes caretMove { from { left: 0; } to { left: calc(100% - .62em); } }
    @keyframes caretShow { 0%, 98% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }

    .cap2 { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px; }
    .cap2 .for { opacity: .55; }
    .close { opacity: .7; }
    .close:hover { opacity: 1; }
    .opt { display: grid; grid-template-columns: 3ch 11ch 1fr 1ch; gap: 8px; width: 100%; padding: 6px 4px; opacity: .65; transition: opacity .3s; }
    .opt:hover, .opt[aria-checked="true"] { opacity: 1; }
    .opt .d, .opt .hk { opacity: .55; }
    .opt[aria-checked="false"] .fl { opacity: .6; }
    .cmdline { padding: 10px 4px 0; word-break: break-all; opacity: .85; }
    .caret { display: inline-block; width: .62em; height: 1.1em; background: var(--lime); vertical-align: -2px; margin-left: 1px; animation: blink 1.1s steps(1) infinite; }

    .send { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 38px; margin-top: 12px; padding: 0 14px;
      border: 1px solid var(--lime); letter-spacing: .04em; transition: background .2s, opacity .3s; }
    .send:hover:not(:disabled) { background: rgba(198, 255, 61, .1); }
    .send:disabled { opacity: .3; }
    .send.busy .lbl::after { content: "_"; animation: blink 1s steps(1) infinite; }

    #hint { margin-top: 8px; padding: 0 4px; opacity: .55; }
    #hint:empty { display: none; }
    #log { margin-top: 8px; padding: 0 4px; }
    .ll { display: grid; grid-template-columns: 8ch 2ch 1fr; gap: 0 6px; }
    .ll .t { opacity: .4; }
    .ll.ok { color: var(--lime); }
    .ll.err { color: var(--err); }
    .ll.info { opacity: .8; }
    .ll .m { word-break: break-word; }
    #fallback { display: none; margin: 8px 4px 0; opacity: .8; }
    #fallback:hover { opacity: 1; }

    #particles { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

    @media (prefers-reduced-motion: reduce) {
      .line { transform: none; }
      .tx { clip-path: none; }
      .panel.open .line, .panel.open .tx, .panel.open .orow.cr::after { animation: none; }
      .caret, .send.busy .lbl::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="top"><span>Bridge</span><span>Figma -&gt; Adobe</span></div>

    <main class="stage" id="stage">
      <div class="logos">
        <button class="logo" id="dest-ae" aria-label="After Effects"><span class="mark" id="mark-ae"></span></button>
        <button class="logo" id="dest-ai" aria-label="Illustrator"><span class="mark" id="mark-ai"></span></button>
      </div>
    </main>

    <section class="panel" id="panel">
      <div class="orow cr" style="--i:0"><div class="cap2 tx"><span>$ bridge options <span class="for" id="optfor"></span></span><button class="close" id="back">[<kbd>esc</kbd> close]</button></div></div>
      <div class="orow cr" style="--i:1"><div class="line"></div><button class="opt tx" id="opt-0" role="switch" aria-checked="true"><span class="bx">[x]</span><span class="fl"></span><span class="d"></span><span class="hk"></span></button></div>
      <div class="orow cr" style="--i:2"><div class="line"></div><button class="opt tx" id="opt-1" role="switch" aria-checked="true"><span class="bx">[x]</span><span class="fl"></span><span class="d"></span><span class="hk"></span></button></div>
      <div class="orow cr" style="--i:3"><div class="line"></div><button class="opt tx" id="opt-2" role="switch" aria-checked="true"><span class="bx">[x]</span><span class="fl"></span><span class="d"></span><span class="hk"></span></button></div>
      <div class="orow cr" style="--i:4"><div class="line"></div><button class="opt tx" id="opt-3" role="switch" aria-checked="true"><span class="bx">[x]</span><span class="fl"></span><span class="d"></span><span class="hk"></span></button></div>
      <div class="orow" style="--i:5"><div class="line"></div></div>
      <div class="cmdline tx" style="--i:5"><span class="p">$</span> <span id="cmd"></span><span class="caret"></span></div>
      <button class="send tx" id="send" style="--i:6" disabled><span class="lbl">send</span><span>&crarr;</span></button>
    </section>

    <div id="hint" role="status"></div>
    <div id="log" role="log" aria-live="polite"></div>
    <button id="fallback">[<kbd>d</kbd> download files instead]</button>
  </div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <script>
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const TAU = Math.PI * 2;
    const rnd = Math.random;
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
    const ease = (cur, tgt, dt, tau) => cur + (tgt - cur) * (1 - Math.exp(-dt / tau));

    /* =========================================================
       Particle shapes
       ========================================================= */
    function sdRect(px, py, hw, hh, r) {
      const qx = Math.abs(px) - (hw - r), qy = Math.abs(py) - (hh - r);
      return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
    }
    // points around a rounded rectangle (clockwise), with outward normals
    function rrPoints(w, h, r, step) {
      r = Math.max(0.5, Math.min(r, w / 2, h / 2));
      const a = Math.max(0, w - 2 * r), b = Math.max(0, h - 2 * r), q = Math.PI * r / 2;
      const lens = [a, q, b, q, a, q, b, q], per = lens.reduce((s, v) => s + v, 0), out = [];
      for (let s = 0; s < per; s += step) {
        let u = s, seg = 0;
        while (seg < 7 && u > lens[seg]) { u -= lens[seg]; seg++; }
        const t = lens[seg] > 0 ? u / lens[seg] : 0;
        let x, y, nx, ny;
        if (seg === 0) { x = r + t * a; y = 0; nx = 0; ny = -1; }
        else if (seg === 2) { x = w; y = r + t * b; nx = 1; ny = 0; }
        else if (seg === 4) { x = w - r - t * a; y = h; nx = 0; ny = 1; }
        else if (seg === 6) { x = 0; y = h - r - t * b; nx = -1; ny = 0; }
        else {
          const base = seg === 1 ? -Math.PI / 2 : seg === 3 ? 0 : seg === 5 ? Math.PI / 2 : Math.PI;
          const cx = (seg === 1 || seg === 3) ? w - r : r, cy = (seg === 1 || seg === 7) ? r : h - r;
          const ang = base + t * Math.PI / 2;
          nx = Math.cos(ang); ny = Math.sin(ang); x = cx + r * nx; y = cy + r * ny;
        }
        out.push([x, y, nx, ny]);
      }
      return out;
    }
    // rasterise text at 4x so we can trace its outline
    function rasterText(label, w, h, S) {
      const c = document.createElement('canvas');
      c.width = Math.ceil(w * S); c.height = Math.ceil(h * S);
      const g = c.getContext('2d', { willReadFrequently: true });
      let size = h * 0.6;
      const fam = 'Inter, "Helvetica Neue", Arial, sans-serif';
      g.font = '600 ' + (size * S) + 'px ' + fam;
      const mw = g.measureText(label).width / S;
      if (mw > 0) size = size * (w * 0.7) / mw;
      g.font = '600 ' + (size * S) + 'px ' + fam;
      g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = '#fff';
      g.fillText(label, c.width / 2, (h / 2 + size * 0.36) * S);
      const d = g.getImageData(0, 0, c.width, c.height).data;
      const m = new Uint8Array(c.width * c.height);
      for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 128 ? 1 : 0;
      return { m, W: c.width, H: c.height, S };
    }
    // evenly spaced points along the glyph outlines (Poisson-style thinning of the contour)
    function textOutline(mk, rmin) {
      const { m, W, H, S } = mk, pts = [];
      for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        if (m[i] && (!m[i - 1] || !m[i + 1] || !m[i - W] || !m[i + W])) pts.push([x, y]);
      }
      for (let i = pts.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = pts[i]; pts[i] = pts[j]; pts[j] = t; }
      const cell = rmin * S / 1.4142, grid = new Map(), out = [];
      for (const p of pts) {
        const cx = Math.floor(p[0] / cell), cy = Math.floor(p[1] / cell);
        let ok = true;
        for (let dx = -2; dx <= 2 && ok; dx++) for (let dy = -2; dy <= 2; dy++) {
          const q = grid.get((cx + dx) * 100000 + (cy + dy));
          if (q && Math.hypot(q[0] - p[0], q[1] - p[1]) < rmin * S) { ok = false; break; }
        }
        if (ok) { grid.set(cx * 100000 + cy, p); out.push([p[0] / S, p[1] / S]); }
      }
      return out;
    }
    function nearLetter(mk, x, y) {
      const { m, W, H, S } = mk;
      for (const dx of [-4, 0, 4]) for (const dy of [-4, 0, 4]) {
        const ix = Math.round((x + dx) * S), iy = Math.round((y + dy) * S);
        if (ix >= 0 && iy >= 0 && ix < W && iy < H && m[iy * W + ix]) return true;
      }
      return false;
    }

    function specBox(w, h, r) {
      const out = [];
      rrPoints(w, h, r, 1.5).forEach(p => { for (let l = 0; l < 2; l++) { const j = (rnd() - 0.5) * 1.1; out.push({ ox: p[0] + p[2] * j, oy: p[1] + p[3] * j, kind: 0 }); } });
      return out;
    }
    function specLogo(w, h, label) {
      const r = w * 0.24, out = specBox(w, h, r);
      const mk = rasterText(label, w, h, 4);
      textOutline(mk, 1.5).forEach(p => { for (let l = 0; l < 2; l++) out.push({ ox: p[0] + (rnd() - 0.5) * 0.9, oy: p[1] + (rnd() - 0.5) * 0.9, kind: 0 }); });
      let n = 0, tries = 0;
      while (n < 520 && tries < 9000) {        // stipple fill: denser toward the edge, letters left open
        tries++;
        const x = rnd() * w, y = rnd() * h;
        const sd = sdRect(x - w / 2, y - h / 2, w / 2 - 3, h / 2 - 3, r - 3);
        if (sd > -2.5 || nearLetter(mk, x, y)) continue;
        if (rnd() > 1 - 0.65 * smooth(0, 16, -sd)) continue;
        out.push({ ox: x, oy: y, kind: 1, th: clamp01(rnd() * 0.5 + (-sd) / 50) });
        n++;
      }
      return out;
    }

    /* =========================================================
       Particle engine: springs, idle drift, cursor wake
       ========================================================= */
    const COLORS = [[198, 255, 61], [150, 255, 100], [225, 255, 170]];
    const LEVELS = [0.3, 0.55, 0.8, 1];
    const cv = document.getElementById('particles');
    let W = 0, H = 0, ctx;
    function sizeCanvas() {
      W = innerWidth; H = innerHeight;
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx = cv.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    sizeCanvas();
    addEventListener('resize', sizeCanvas);

    const mouse = { x: -999, y: -999, vx: 0, vy: 0, t: 0 };
    addEventListener('mousemove', (e) => {
      const now = performance.now(), dtm = Math.max(8, now - mouse.t) / 1000;
      if (mouse.x > -900) {
        mouse.vx = 0.6 * mouse.vx + 0.4 * Math.max(-1800, Math.min(1800, (e.clientX - mouse.x) / dtm));
        mouse.vy = 0.6 * mouse.vy + 0.4 * Math.max(-1800, Math.min(1800, (e.clientY - mouse.y) / dtm));
      }
      mouse.x = e.clientX; mouse.y = e.clientY; mouse.t = now;
    });
    document.addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; mouse.vx = mouse.vy = 0; });

    const CURSOR_R = 50, REP = 4800, SWIRL = 2200, WAKE = 1.5;

    class Group {
      constructor(el, kind, o) {
        this.el = el; this.kind = kind; this.label = o && o.label; this.radius = (o && o.radius) || 6;
        this.ps = null; this.w = 0; this.h = 0; this.vis = false;
        this.alpha = 1; this.alphaT = 1; this.fill = 0; this.fillT = 0; this.hover = 0;
        this.reacts = !!(o && o.reacts); this.spawn = null; this.rect = null;
      }
      build(w, h) {
        const spec = specLogo(w, h, this.label);
        this.ps = spec.map(s => {
          const k = 14 + rnd() * 16, cr = rnd();
          return { ox: s.ox, oy: s.oy, kind: s.kind, th: s.th || 0, x: 0, y: 0, vx: 0, vy: 0, k, c: 2 * Math.sqrt(k) * (0.5 + rnd() * 0.2),
            r: 0.55 + rnd() * 0.7, ph: rnd() * TAU, f: 0.4 + rnd() * 0.9, tw: 0.8 + rnd() * 2,
            amp: s.kind ? 1 + rnd() * 1.4 : 0.25 + rnd() * 0.35, a: (s.kind ? 0.45 : 0.65) + rnd() * 0.35,
            col: cr < 0.15 ? 1 : cr < 0.3 ? 2 : 0, big: rnd() < 0.04, on: false };
        });
        this.w = w; this.h = h;
      }
      respawn(rect) {
        for (const p of this.ps) {
          const a = rnd() * TAU, d = 50 + rnd() * 90;      // gather out of a loose cloud
          p.x = rect.left + this.w / 2 + Math.cos(a) * d; p.y = rect.top + this.h / 2 + Math.sin(a) * d;
          p.vx = p.vy = 0; p.on = false;
        }
      }
      burst(x, y) {
        this.spawn = { x, y, t: performance.now() / 1000 };
        if (!this.ps) return;
        for (const p of this.ps) {
          const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1, imp = 420 * Math.exp(-d / 45);
          p.vx += dx / d * imp; p.vy += dy / d * imp;
        }
      }
      update(dt, t, paths) {
        const r = this.el.getBoundingClientRect();
        this.rect = r;
        if (!(r.width > 2)) { this.vis = false; return; }
        const w = r.width, h = r.height;
        if (!this.ps || Math.abs(w - this.w) > 1.5 || Math.abs(h - this.h) > 1.5) { this.build(w, h); this.vis = false; }
        if (!this.vis) { this.respawn(r); this.vis = true; if (REDUCED) for (const p of this.ps) { p.x = r.left + p.ox; p.y = r.top + p.oy; } }

        const inside = this.reacts && mouse.x > r.left - 6 && mouse.x < r.right + 6 && mouse.y > r.top - 6 && mouse.y < r.bottom + 6;
        this.hover = REDUCED ? (inside ? 1 : 0) : ease(this.hover, inside ? 1 : 0, dt, 0.25);
        this.alpha = REDUCED ? this.alphaT : ease(this.alpha, this.alphaT, dt, 0.4);
        const ft = this.fillT > 0.99 ? 1 : Math.max(this.fillT, inside && this.alphaT > 0.5 ? 0.3 : 0);
        this.fill = REDUCED ? ft : ease(this.fill, ft, dt, this.fillT > 0.99 ? 0.9 : 0.5);

        const wake = this.hover;
        for (const p of this.ps) {
          const drift = p.amp * (p.kind ? 1 : 1 + 0.8 * wake);
          const hx = r.left + p.ox + (REDUCED ? 0 : Math.sin(t * p.f + p.ph) * drift);
          const hy = r.top + p.oy + (REDUCED ? 0 : Math.cos(t * p.f * 0.9 + p.ph * 1.3) * drift);
          let a = p.a * this.alpha;
          if (p.kind) {
            const v = clamp01((this.fill - p.th) * 5);
            if (v <= 0.01) { p.on = false; p.x = hx; p.y = hy; p.vx = p.vy = 0; continue; }
            a *= v;
            if (!p.on) {
              p.on = true;
              if (this.spawn && t - this.spawn.t < 1.2 && !REDUCED) {   // new stipple bursts out of the click
                p.x = this.spawn.x + (rnd() - 0.5) * 8; p.y = this.spawn.y + (rnd() - 0.5) * 8;
                p.vx = (rnd() - 0.5) * 260; p.vy = (rnd() - 0.5) * 260;
              }
            }
          }
          let speed = 0;
          if (REDUCED) { p.x = hx; p.y = hy; }
          else {
            let ax = (hx - p.x) * p.k - p.vx * p.c, ay = (hy - p.y) * p.k - p.vy * p.c;
            const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
            if (d2 < CURSOR_R * CURSOR_R) {
              const d = Math.sqrt(d2) || 1, f = Math.pow(1 - d / CURSOR_R, 1.5);
              ax += dx / d * f * REP - dy / d * f * SWIRL + mouse.vx * f * WAKE;
              ay += dy / d * f * REP + dx / d * f * SWIRL + mouse.vy * f * WAKE;
            }
            p.vx += ax * dt; p.vy += ay * dt;
            speed = Math.hypot(p.vx, p.vy);
            if (speed > 520) { p.vx *= 520 / speed; p.vy *= 520 / speed; speed = 520; }   // keep the splash contained
            p.x += p.vx * dt; p.y += p.vy * dt;
          }
          a *= 0.8 + 0.2 * Math.sin(t * p.tw + p.ph);
          a += Math.min(0.35, speed / 260);
          if (a < 0.06) continue;
          const rad = p.r * (1 + Math.min(0.5, speed / 220)) * (p.kind ? 0.9 : 1) * (1 + 0.15 * wake);
          const q = Math.min(3, (a * 4) | 0), path = paths[p.col * 4 + q];
          path.moveTo(p.x + rad, p.y); path.arc(p.x, p.y, rad, 0, TAU);
          if (p.big && a > 0.5) { paths.halo.moveTo(p.x + rad * 3.2, p.y); paths.halo.arc(p.x, p.y, rad * 3.2, 0, TAU); }
        }
      }
    }

    const mk = (id, kind, o) => new Group(document.getElementById(id), kind, o);
    const groups = {
      ae: mk('mark-ae', 'logo', { label: 'Ae', reacts: true }),
      ai: mk('mark-ai', 'logo', { label: 'Ai', reacts: true })
    };
    const allGroups = [groups.ae, groups.ai];

    let lastFrame = 0;
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.033, lastFrame ? (now - lastFrame) / 1000 : 0.016);
      lastFrame = now;
      const t = now / 1000;
      mouse.vx *= 0.9; mouse.vy *= 0.9;
      ctx.clearRect(0, 0, W, H);
      const paths = { halo: new Path2D() };
      for (let i = 0; i < 12; i++) paths[i] = new Path2D();
      for (const g of allGroups) g.update(dt, t, paths);
      ctx.fillStyle = 'rgba(198,255,61,0.1)'; ctx.fill(paths.halo);
      for (let c = 0; c < 3; c++) for (let q = 0; q < 4; q++) {
        ctx.fillStyle = 'rgba(' + COLORS[c].join(',') + ',' + LEVELS[q] + ')';
        ctx.fill(paths[c * 4 + q]);
      }
    }
    requestAnimationFrame(frame);

    /* =========================================================
       Flags, command, log
       ========================================================= */
    const PORTS = { ae: 3790, ai: 3791 };
    const NAMES = { ae: 'after effects', ai: 'illustrator' };
    const SLUG = { ae: 'after-effects', ai: 'illustrator' };
    const FLAGS = {
      ae: [['newdoc', 'new-file', 'new composition', 'n'], ['split', 'split', 'frames into layers', 's'], ['png', 'png', 'images as png', 'p'], ['shapes', 'shapes', 'vectors to shapes', 'h']],
      ai: [['newdoc', 'new-file', 'new artboard', 'n'], ['split', 'split', 'frames into layers', 's'], ['png', 'png', 'images as png', 'p'], ['text', 'live-text', 'keep text editable', 't']]
    };
    const opts = { newdoc: true, split: true, png: true, shapes: true, text: false };

    const appEl = document.getElementById('app');
    const stageEl = document.getElementById('stage');
    const panelEl = document.getElementById('panel');
    const logEl = document.getElementById('log');
    const hintEl = document.getElementById('hint');
    const cmdEl = document.getElementById('cmd');
    const sendBtn = document.getElementById('send');
    const backBtn = document.getElementById('back');
    const fallbackBtn = document.getElementById('fallback');
    const dests = { ae: document.getElementById('dest-ae'), ai: document.getElementById('dest-ai') };
    const optEls = [0, 1, 2, 3].map(i => document.getElementById('opt-' + i));
    const connected = { ae: false, ai: false };
    let selectionCount = 0, lastExport = null, pendingTarget = null, selectedTarget = null, busy = false;
    let typeTimer = null, spinTimer = null, cmdDelay = null;

    function fitWindow() {
      requestAnimationFrame(() => {
        const h = Math.ceil(appEl.getBoundingClientRect().height) + 32;
        parent.postMessage({ pluginMessage: { type: 'resize', height: h } }, '*');
      });
    }
    function buildCmd() {
      if (!selectedTarget) return '';
      const on = FLAGS[selectedTarget].filter(f => opts[f[0]]).map(f => '--' + f[1]);
      return ['bridge send --to ' + SLUG[selectedTarget]].concat(on).join(' ');
    }
    function renderCmd(animate) {
      clearInterval(typeTimer); clearTimeout(cmdDelay);
      const text = buildCmd();
      if (!animate || REDUCED) { cmdEl.textContent = text; fitWindow(); return; }
      let i = 0;
      cmdEl.textContent = '';
      typeTimer = setInterval(() => {
        i += 2;
        cmdEl.textContent = text.slice(0, i);
        if (i >= text.length) { clearInterval(typeTimer); cmdEl.textContent = text; fitWindow(); }
      }, 16);
    }
    function stamp() { return new Date().toTimeString().slice(0, 8); }
    function log(text, kind) {
      const sym = kind === 'ok' ? '\u2713' : kind === 'err' ? '\u2717' : '>';
      const row = document.createElement('div');
      row.className = 'll ' + (kind || 'info');
      row.innerHTML = '<span class="t"></span><span class="s"></span><span class="m"></span>';
      row.children[0].textContent = stamp();
      row.children[1].textContent = sym;
      row.children[2].textContent = text;
      logEl.appendChild(row);
      while (logEl.children.length > 3) logEl.removeChild(logEl.firstChild);
      fitWindow();
    }
    function setHint(text) { hintEl.textContent = text; fitWindow(); }
    function idleHint() {
      if (busy) return;
      if (!selectedTarget) setHint('');
      else if (!connected[selectedTarget]) setHint('# open window > extensions > figma bridge in ' + NAMES[selectedTarget]);
      else if (!selectionCount) setHint('# select a layer in figma');
      else setHint('# ' + selectionCount + (selectionCount === 1 ? ' layer' : ' layers') + ' ready. press enter to run');
    }
    function startSpin(label) {
      const frames = ['\u280B', '\u2819', '\u2839', '\u2838', '\u283C', '\u2834', '\u2826', '\u2827', '\u2807', '\u280F'];
      let i = 0;
      clearInterval(spinTimer);
      hintEl.textContent = frames[0] + ' ' + label;
      if (REDUCED) return;
      spinTimer = setInterval(() => { i = (i + 1) % frames.length; hintEl.textContent = frames[i] + ' ' + label; }, 80);
    }
    function stopSpin() { clearInterval(spinTimer); }

    /* =========================================================
       Portal behaviour
       ========================================================= */
    function refreshUI() {
      sendBtn.disabled = !(selectedTarget && selectionCount > 0) || busy;
      sendBtn.querySelector('.lbl').textContent = busy ? 'sending' : (selectedTarget ? 'send to ' + NAMES[selectedTarget] : 'send');
    }
    function setBox(el, on) {
      el.setAttribute('aria-checked', String(on));
      el.querySelector('.bx').textContent = on ? '[x]' : '[ ]';
    }
    function renderOptions(k) {
      document.getElementById('optfor').textContent = '--to ' + SLUG[k];
      FLAGS[k].forEach((f, i) => {
        const el = optEls[i];
        el.dataset.key = f[0];
        el.querySelector('.fl').textContent = '--' + f[1];
        el.querySelector('.d').textContent = f[2];
        el.querySelector('.hk').textContent = f[3];
        setBox(el, opts[f[0]]);
      });
    }
    function toggleFlag(key) {
      opts[key] = !opts[key];
      const el = optEls.find(e => e.dataset.key === key);
      if (el) setBox(el, opts[key]);
      renderCmd(false);
    }
    function centerOf(k) {
      const r = document.getElementById('mark-' + k).getBoundingClientRect();
      return [r.left + r.width / 2, r.top + r.height / 2];
    }
    function openPanel(k, x, y) {
      selectedTarget = k;
      const c = (x === undefined) ? centerOf(k) : [x, y];
      for (const o of ['ae', 'ai']) {
        dests[o].classList.toggle('sel', o === k); dests[o].classList.toggle('dim', o !== k);
        groups[o].fillT = o === k ? 1 : 0;
        groups[o].alphaT = o === k ? 1 : 0.35;
      }
      groups[k].burst(c[0], c[1]);
      renderOptions(k);
      stageEl.classList.add('compact');
      panelEl.classList.remove('open'); void panelEl.offsetWidth; panelEl.classList.add('open');   // replay the staggered reveal
      cmdEl.textContent = '';
      clearInterval(typeTimer); clearTimeout(cmdDelay);
      if (REDUCED) renderCmd(false);
      else cmdDelay = setTimeout(() => renderCmd(true), 5 * 190 + 320);                              // type the command once the rows are in
      refreshUI(); idleHint(); fitWindow();
    }
    function closePanel() {
      if (!selectedTarget) return;
      selectedTarget = null;
      for (const o of ['ae', 'ai']) { dests[o].classList.remove('sel', 'dim'); groups[o].fillT = 0; groups[o].alphaT = 1; }
      panelEl.classList.remove('open');
      stageEl.classList.remove('compact');
      renderCmd(false);
      refreshUI(); idleHint(); fitWindow();
    }
    for (const k of ['ae', 'ai']) {
      dests[k].addEventListener('click', (e) => {
        if (selectedTarget === k) closePanel();
        else openPanel(k, e.detail ? e.clientX : undefined, e.detail ? e.clientY : undefined);
      });
    }
    optEls.forEach(el => el.addEventListener('click', () => { if (el.dataset.key) toggleFlag(el.dataset.key); }));
    backBtn.addEventListener('click', closePanel);

    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = String(e.key || '').toLowerCase();
      const onBtn = e.target && e.target.closest && e.target.closest('button');
      if (k === '1') { if (selectedTarget !== 'ae') openPanel('ae'); }
      else if (k === '2') { if (selectedTarget !== 'ai') openPanel('ai'); }
      else if (k === 'escape') closePanel();
      else if (k === 'enter' && !onBtn) runSend();
      else if (k === 'd' && fallbackBtn.style.display !== 'none' && fallbackBtn.style.display !== '') fallbackBtn.click();
      else if (selectedTarget) {
        const f = FLAGS[selectedTarget].find(x => x[3] === k);
        if (f) toggleFlag(f[0]);
      }
    });

    async function ping() {
      let changed = false;
      for (const t of ['ae', 'ai']) {
        let ok = false;
        try { const r = await fetch('http://localhost:' + PORTS[t] + '/ping'); ok = r.ok; } catch (e) { ok = false; }
        if (ok !== connected[t]) { connected[t] = ok; changed = true; log(NAMES[t] + ' :' + PORTS[t] + ' ' + (ok ? 'online' : 'offline'), ok ? 'ok' : 'info'); }
      }
      if (changed) { refreshUI(); idleHint(); }
    }
    ping();
    setInterval(ping, 3000);

    /* =========================================================
       Send
       ========================================================= */
    function runSend() {
      if (!selectedTarget || selectionCount === 0 || busy) return;
      fallbackBtn.style.display = 'none';
      pendingTarget = selectedTarget; busy = true;
      sendBtn.classList.add('busy');
      refreshUI();
      log('exporting ' + selectionCount + (selectionCount === 1 ? ' layer' : ' layers'));
      startSpin('working');
      parent.postMessage({ pluginMessage: {
        type: 'transfer', target: selectedTarget,
        keepText: opts.text, split: opts.split, imagesAsPng: opts.png, convertShapes: opts.shapes
      } }, '*');
    }
    sendBtn.addEventListener('click', runSend);

    function settle() {
      busy = false; pendingTarget = null;
      sendBtn.classList.remove('busy');
      stopSpin();
      refreshUI(); idleHint();
    }

    function toBase64(bytes) {
      let s = ''; const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      return btoa(s);
    }
    function addReferenceRect(svg) {
      const m = svg.match(/<svg[^>]*>/);
      if (!m) return svg;
      let x = 0, y = 0, w, h;
      const vb = m[0].match(/viewBox="([-\d.\s]+)"/);
      if (vb) { const p = vb[1].trim().split(/\s+/).map(Number); x = p[0]; y = p[1]; w = p[2]; h = p[3]; }
      else {
        const wm = m[0].match(/\swidth="([\d.]+)"/), hm = m[0].match(/\sheight="([\d.]+)"/);
        if (!wm || !hm) return svg;
        w = parseFloat(wm[1]); h = parseFloat(hm[1]);
      }
      if (!(w > 0 && h > 0)) return svg;
      const rect = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="none" stroke="none"/>';
      return svg.replace(m[0], () => m[0] + rect);
    }

    async function sendToAdobe(msg) {
      log('sending to ' + NAMES[msg.target] + ' :' + PORTS[msg.target]);
      const dec = new TextDecoder();
      const payload = {
        frame: msg.frame,
        options: { convertShapes: msg.convertShapes, newDoc: opts.newdoc },
        items: msg.items.map(i => {
          const bytes = new Uint8Array(i.bytes);
          const base = { name: i.name, x: i.x, y: i.y, w: i.w, h: i.h, kind: i.kind };
          return i.kind === 'png'
            ? Object.assign(base, { png: toBase64(bytes) })
            : Object.assign(base, { svg: msg.target === 'ai' ? addReferenceRect(dec.decode(bytes)) : dec.decode(bytes) });
        })
      };
      try {
        const res = await fetch('http://localhost:' + PORTS[msg.target] + '/import', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const out = await res.json();
        settle();
        if (out.ok) {
          const problems = (out.errors || []).concat(msg.skipped || []);
          if (problems.length) log('sent ' + out.made + ' of ' + (out.total + (msg.skipped || []).length) + '. problem with: ' + problems.join(' | '), 'err');
          else log('sent ' + out.made + (out.made === 1 ? ' layer' : ' layers') + ' to ' + NAMES[msg.target], 'ok');
          groups[msg.target].burst(centerOf(msg.target)[0], centerOf(msg.target)[1]);
        } else {
          log(NAMES[msg.target] + ' reported: ' + out.error, 'err');
        }
      } catch (e) {
        settle();
        log('could not reach ' + NAMES[msg.target] + '. open window > extensions > figma bridge there, then run again', 'err');
        fallbackBtn.style.display = 'block';
        fitWindow();
      }
    }

    // ---- Fallback: plain SVG / PNG / zip download ----
    function download(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    const crcTable = (() => {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
      return t;
    })();
    function crc32(buf) { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
    function makeZip(files) {
      const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
      for (const f of files) {
        const name = enc.encode(f.name), data = f.bytes, crc = crc32(data);
        const lh = new DataView(new ArrayBuffer(30));
        lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
        lh.setUint16(12, 33, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true);
        lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
        parts.push(new Uint8Array(lh.buffer), name, data);
        const ch = new DataView(new ArrayBuffer(46));
        ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
        ch.setUint16(14, 33, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true);
        ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
        central.push(new Uint8Array(ch.buffer), name);
        offset += 30 + name.length + data.length;
      }
      const cdSize = central.reduce((n, p) => n + p.length, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
      end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
      return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
    }
    fallbackBtn.addEventListener('click', () => {
      if (!lastExport) return;
      const used = {};
      const files = lastExport.items.map(i => {
        let base = (i.name || 'layer').replace(/[^a-zA-Z0-9_-]+/g, '_') || 'layer';
        used[base] = (used[base] || 0) + 1;
        return { name: (used[base] > 1 ? base + '_' + used[base] : base) + (i.kind === 'png' ? '.png' : '.svg'), bytes: new Uint8Array(i.bytes) };
      });
      if (files.length === 1) download(new Blob([files[0].bytes], { type: files[0].name.endsWith('.png') ? 'image/png' : 'image/svg+xml' }), files[0].name);
      else download(makeZip(files), 'figma-export.zip');
      log('saved ' + files.length + (files.length === 1 ? ' file' : ' files') + ' to downloads', 'ok');
    });

    // ---- Messages from code.js ----
    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'selection') {
        selectionCount = msg.count;
        refreshUI(); idleHint();
      } else if (msg.type === 'export-ready') {
        lastExport = msg;
        sendToAdobe(msg);
      } else if (msg.type === 'error') {
        settle();
        log(msg.message, 'err');
      }
    };
    refreshUI();
    fitWindow();
  </script>
</body>
</html>
  </script>
</body>
</html>
